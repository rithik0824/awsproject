name: CD - Deploy to AWS (CloudFormation & SSM)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy-infrastructure:
    name: Deploy AWS CloudFormation Stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy CloudFormation Stack
        id: cfn-deploy
        run: |
          STACK_NAME="hospital-portal-${{ github.event.inputs.environment || 'production' }}"
          echo "Deploying CloudFormation stack: $STACK_NAME"

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation.yml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              EnvironmentName="${{ github.event.inputs.environment || 'production' }}" \
              HospitalName="Metropolitan General Hospital" \
            --no-fail-on-empty-changeset

          echo "Fetching CloudFormation stack outputs..."
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs" \
            --output table

      - name: Trigger Remote Update via AWS Systems Manager (SSM)
        run: |
          STACK_NAME="hospital-portal-${{ github.event.inputs.environment || 'production' }}"
          
          # Retrieve EC2 Instance ID from CloudFormation outputs
          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text)

          echo "Target Instance ID: $INSTANCE_ID"

          if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
            echo "Sending SSM Run Command to instance $INSTANCE_ID..."
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["cd /opt/hospital-portal && docker compose restart hospital-app || true"]' \
              --query "Command.CommandId" \
              --output text)

            echo "SSM Command dispatched. Command ID: $COMMAND_ID"
          fi
